backend:
  name: git-gateway
  site_domain: wanjiaxiu.us
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "封面图", name: "image", widget: "image", required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}

  - name: "videos"
    label: "施工视频"
    folder: "api/v1/entities/video"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "title"
    slug: "{{slug}}"
    fields:
      - {label: "视频标题", name: "title", widget: "string"}
      - {label: "YouTube 视频链接", name: "url", widget: "string"}
      - label: "服务类别"
        name: "category"
        widget: "select"
        options:
          - { label: "水电维修安装", value: "plumbing_electric" }
          - { label: "家庭装修维修", value: "home_repair" }
          - { label: "家电与家具安装", value: "appliance_furniture" }
          - { label: "割草修树庭院清理", value: "lawn_yard" }
          - { label: "广告标识维修", value: "signage" }
          - { label: "包年房屋维护", value: "annual_maintenance" }
